<!DOCTYPE html>
<html lang="es">
  
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal blog by David Patiño sharing insights on web development, technology, and personal growth." />
    <meta name="author" content="David Patiño" />
		
		<title>David Patiño - Personal Blog</title>
		
		<!-- SWIPER JS -->
		<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
		<script src="https://unpkg.com/swiper/swiper-bundle.min.js" defer></script>
		
		<!-- TAILWIND CSS OUTPUT -->
		<link href="./src/styles/output.css" rel="stylesheet" />
		
		<!-- CUSTOM CSS -->
    <link href="./src/styles/styles.css" rel="stylesheet" />
		
  </head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100">

		<!-- Navigation -->
		<header id="NavBar"></header>

    <!-- Header Hero Section con Parallax -->
    <section id="postHero" class="relative h-[50vh] bg-gradient-to-r from-blue-900 to-blue-600 text-white overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-50"></div>
        <div id="parallaxBg" class="absolute inset-0 bg-center bg-cover transform scale-110" style="background-image: url('')"></div>
        <div class="container mx-auto px-4 h-full flex items-center relative z-10">
            <div class="max-w-3xl pb-12">
                <!-- Breadcrumb -->
                <nav class="flex items-center space-x-2 text-sm mb-6 opacity-80">
                    <a href="/" class="hover:text-white transition-colors">Inicio</a>
                    <span>→</span>
                    <a href="/posts.html" class="hover:text-white transition-colors">Blog</a>
                </nav>
                
                <!-- Post Meta -->
                <div class="inline-flex items-center space-x-4 px-4 py-2 bg-black/30 rounded-full backdrop-blur-sm mb-4">
                    <span id="postAuthor" class="font-medium"></span>
                    <span class="w-1 h-1 bg-white rounded-full"></span>
                    <span id="postDate"></span>
                </div>
                
                <h1 id="postTitle" class="text-5xl md:text-6xl font-bold mb-6 leading-tight"></h1>
                <div id="postTags" class="mt-8 flex flex-wrap gap-2"></div>
            </div>
        </div>
    </section>
    
    <!-- Contenido Principal -->
    <main class="container mx-auto px-4 py-12 -mt-32 relative z-20">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

                <!-- Imagen Principal con Efecto -->
                <div class="relative overflow-hidden">
                    <img id="postImage" loading="lazy" class="w-full h-[500px] object-cover transform hover:scale-105 transition-transform duration-700" alt="" />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                </div>
                
                <!-- Contenido del Post -->
                <div class="p-8 md:p-12">
                    
                    <div class="prose prose-lg max-w-none">
                        <div id="postDescription" class="space-y-6">
                            <!-- El contenido del post se insertará aquí -->
                        </div>
                    </div>

                    <!-- Posts Relacionados -->
                    <div class="mt-16 pt-8 border-t border-gray-100">
                        <h2 class="text-3xl font-bold mb-8">Lecturas Relacionadas</h2>
												<section id="carouselContainer" class="container mx-auto px-4 relative py-8">
													<div class="relative">
															<!-- Carrusel con Swiper -->
															<div class="swiper">
																	<!-- Contenedor de las tarjetas -->
																	<div class="swiper-wrapper">
																			<!-- Tarjetas generadas dinámicamente -->
																	</div>
															</div>
						
															<!-- Indicadores -->
															<div class="">
																	<div class="swiper-pagination text-black"></div>
															</div>
													</div>
											</section>
                    </div>

                    <!-- Sección de Compartir -->
                    <div class="mt-12 pt-8 border-t border-gray-100">
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold">Conoce Más</h3>
                            <div class="flex space-x-4">
                                <button class="share-button" data-platform="twitter">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg>
                                </button>
                                <button class="share-button" data-platform="linkedin">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                                </button>
                                <button class="share-button" data-platform="facebook">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

		<!-- Footer -->
		 <footer id="Footer"></footer>

    <script type="module" src="./src/lib/post-detail.js"></script>
    <script type="module" src="./src/components/PostCarousel.js"></script>
    <script type="module" src="./src/components/NavBar.js"></script>
    <script type="module" src="./src/components/Footer.js"></script>
</body>
</html>
