<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts | Blog Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100">

    <!-- NavBar -->
    <header id="NavBar"></header>

    <!-- Header Hero Section -->
    <section class="relative h-[40vh] bg-gradient-to-r from-gray-600 to-gray-800 text-white">
        <div class="absolute inset-0 bg-black opacity-20"></div>
        <div class="container mx-auto px-4 h-full flex items-center relative z-10">
            <div class="max-w-3xl">
                <h1 class="text-5xl font-bold mb-6">Mis Publicaciones</h1>
                <p class="text-xl opacity-90">Explora mi colección de artículos sobre tecnología, creatividad y desarrollo personal</p>
            </div>
        </div>
    </section>

    <!-- Grid de Posts -->
    <main class="container mx-auto px-4 py-12 -mt-20 relative z-20">
        <div class="max-w-7xl mx-auto">
            <!-- Grid de Posts -->
            <div id="postsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Los posts se cargarán dinámicamente aquí -->
            </div>
            
            <!-- Indicador de Carga -->
            <div id="loadingIndicator" class="hidden">
                <div class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="Footer"></footer>

    <script type="module" src="./src/lib/postsList.js"></script>
    <script type="module" src="./src/components/NavBar.js"></script>
    <script type="module" src="./src/components/Footer.js"></script>
</body>
</html>
